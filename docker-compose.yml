version: '3.9'

services:
  # FieldTracker App1 Main Application
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldtracker_app1
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-fieldtracker_db}
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fieldtracker_network
    command: npm run dev

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fieldtracker_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-fieldtracker_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldtracker_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fieldtracker_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldtracker_network

  # Web Dashboard (React)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fieldtracker_dashboard
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - app1
    networks:
      - fieldtracker_network

volumes:
  postgres_data:
  redis_data:

networks:
  fieldtracker_network:
    driver: bridge
