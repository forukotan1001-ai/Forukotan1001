version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ueba_db
    environment:
      POSTGRES_DB: ueba_security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-example}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host:container (useful for local DB access)
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ueba_network

  redis:
    image: redis:7
    container_name: ueba_redis
    ports:
      - "6379:6379"
    networks:
      - ueba_network

  web:
    build: .
    container_name: ueba_web
    env_file:
      - .env
    environment:
      # Default connection string inside compose network
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-example}@db:5432/ueba_security
      # Useful defaults (override in .env or environment)
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change_this}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./static:/app/static
    networks:
      - ueba_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:

networks:
  ueba_network:
    driver: bridge
