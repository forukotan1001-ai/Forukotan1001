name: CI - Docker build, scan, migrate, smoke-tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-scan-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (for smoke-tests)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Docker image
        run: |
          docker build -t ueba-app:ci .

      - name: Scan image with Trivy (high/critical fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ueba-app:ci
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Start DB and Redis services
        run: |
          echo "Starting db and redis via docker compose"
          docker info
          docker compose version || true
          # start only db and redis so we can run migrations deterministically
          docker compose up -d db redis

      - name: Run migrations inside built web image (one-off)
        run: |
          echo "Running migrations inside web container (one-off)"
          # build the image to ensure the migration command runs in the same image
          docker build -t ueba-app:ci .
          # run migration script inside the image via compose one-off run
          # this will fail the job if migrations exit non-zero
          docker compose run --rm -e DATABASE_URL=postgresql://postgres:example@db:5432/ueba_security web python infrastructure/02_auto_migration_on_startup.py

      - name: Bring up web service
        run: |
          echo "Bringing up web service"
          docker compose up -d --build web

      - name: Wait for web readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://127.0.0.1:8000/api/docs >/dev/null 2>&1; then
              echo "App is up" && break
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done

      - name: Smoke test endpoints (containerized)
        run: |
          set -e
          echo "Checking /api/docs"
          curl -sSf http://127.0.0.1:8000/api/docs | head -n 1
          echo "Checking /api/alerts"
          http_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/alerts || true)
          echo "/api/alerts returned HTTP $http_code"
          if [ "$http_code" = "000" ]; then
            echo "Endpoint did not respond"; exit 1
          fi

      - name: Tear down docker compose
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
